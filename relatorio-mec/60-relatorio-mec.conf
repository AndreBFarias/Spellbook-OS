<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontes Microsoft/Google ausentes no Linux -> equivalentes universais.
     Forma <alias>+<accept>: so age como fallback quando a familia pedida
     nao existe de verdade no sistema (auto-neutraliza se a fonte real
     for instalada um dia). Gerenciado por instalar_relatorio_mec.sh. -->
<fontconfig>
  <alias binding="same"><family>Arial Nova</family><accept><family>Arial</family></accept></alias>
  <alias binding="same"><family>Arial Nova Cond</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Arial Nova Cond Light</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Open Sans Condensed</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Open Sans Condensed Light</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Fira Mono</family><accept><family>Courier New</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Arial</family></accept></alias>
</fontconfig>
